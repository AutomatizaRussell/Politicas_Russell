# Static policy site (contract docs/contrato-consentimiento.md §3.5).
#
# No framing restriction is set on purpose: other sites may embed these
# pages today, and blocking that is a decision of its own.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind Coolify's proxy the container sees plain HTTP on port 80; relative
    # redirects keep the public scheme and host (e.g. /v/x/2 -> /v/x/2/).
    absolute_redirect off;

    # Read by the consent service and other projects: always revalidated, so a
    # newly published version is seen at once, and readable cross-origin.
    location = /manifest.json {
        include /etc/nginx/cabeceras.inc;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Fingerprinted file names emitted by the build never change content.
    location /_astro/ {
        include /etc/nginx/cabeceras.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Frozen versions: the text never changes, the shared design may.
    location /v/ {
        include /etc/nginx/cabeceras.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }

    location / {
        include /etc/nginx/cabeceras.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
